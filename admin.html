<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acheda Zanzibar - Admin Panel</title>
    <link
      rel="icon"
      type="image/png"
      href="https://ui-avatars.com/api/?name=AZ&background=1a5276&color=fff&size=32"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      /* =============================================
                   RESET & BASE
                   ============================================= */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --blue-deep: #0a2a3a;
        --blue-primary: #1a5276;
        --blue-bright: #2a7a9a;
        --blue-light: #eaf2f7;
        --orange: #e67e22;
        --orange-light: #f5cba7;
        --white: #ffffff;
        --gray-50: #f8fafc;
        --gray-100: #f1f4f8;
        --gray-200: #e2e8f0;
        --gray-300: #cbd5e1;
        --gray-500: #64748b;
        --gray-700: #1e293b;
        --shadow-sm: 0 2px 8px rgba(10, 42, 58, 0.06);
        --shadow-md: 0 8px 30px rgba(10, 42, 58, 0.1);
        --shadow-lg: 0 20px 60px rgba(10, 42, 58, 0.14);
        --radius: 16px;
        --radius-sm: 10px;
        --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--gray-50);
        color: var(--gray-700);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      /* =============================================
                   BUTTONS
                   ============================================= */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 24px;
        border-radius: 40px;
        font-weight: 600;
        font-size: 0.9rem;
        border: none;
        cursor: pointer;
        transition: var(--transition);
        text-decoration: none;
      }
      .btn-primary {
        background: var(--blue-primary);
        color: #fff;
        box-shadow: 0 4px 16px rgba(26, 82, 118, 0.25);
      }
      .btn-primary:hover {
        background: var(--blue-deep);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(26, 82, 118, 0.35);
      }
      .btn-orange {
        background: var(--orange);
        color: #fff;
        box-shadow: 0 4px 16px rgba(230, 126, 34, 0.3);
      }
      .btn-orange:hover {
        background: #d35400;
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(230, 126, 34, 0.4);
      }
      .btn-danger {
        background: #e74c3c;
        color: #fff;
      }
      .btn-danger:hover {
        background: #c0392b;
        transform: translateY(-2px);
      }
      .btn-outline {
        background: transparent;
        color: var(--blue-primary);
        border: 1.5px solid var(--blue-primary);
      }
      .btn-outline:hover {
        background: var(--blue-primary);
        color: #fff;
      }
      .btn-sm {
        padding: 6px 14px;
        font-size: 0.8rem;
      }
      .btn-block {
        width: 100%;
        justify-content: center;
      }

      /* =============================================
                   AUTH SCREEN
                   ============================================= */
      #authScreen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
      }
      .auth-box {
        background: var(--white);
        padding: 48px 40px;
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        max-width: 420px;
        width: 100%;
        text-align: center;
        border: 1px solid var(--gray-200);
      }
      .auth-box h1 {
        font-family: "Playfair Display", serif;
        font-size: 1.8rem;
        color: var(--blue-deep);
        margin-bottom: 4px;
      }
      .auth-box p {
        color: var(--gray-500);
        font-size: 0.95rem;
        margin-bottom: 24px;
      }
      .auth-box .form-group {
        text-align: left;
        margin-bottom: 16px;
      }
      .auth-box .form-group label {
        display: block;
        font-weight: 500;
        font-size: 0.85rem;
        margin-bottom: 4px;
        color: var(--gray-700);
      }
      .auth-box .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid var(--gray-200);
        border-radius: var(--radius-sm);
        font-size: 0.95rem;
        transition: var(--transition);
        background: var(--gray-50);
      }
      .auth-box .form-group input:focus {
        outline: none;
        border-color: var(--blue-primary);
        box-shadow: 0 0 0 4px rgba(26, 82, 118, 0.08);
        background: var(--white);
      }
      .auth-box .auth-status {
        margin-top: 12px;
        padding: 10px;
        border-radius: var(--radius-sm);
        font-size: 0.9rem;
        display: none;
      }
      .auth-box .auth-status.success {
        display: block;
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .auth-box .auth-status.error {
        display: block;
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      /* =============================================
                   DASHBOARD
                   ============================================= */
      #dashboardScreen {
        display: none;
      }
      #dashboardScreen.active {
        display: block;
      }

      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 0 24px;
        flex-wrap: wrap;
        gap: 12px;
        border-bottom: 2px solid var(--gray-200);
        margin-bottom: 28px;
      }
      .admin-header h1 {
        font-family: "Playfair Display", serif;
        font-size: 1.8rem;
        color: var(--blue-deep);
      }
      .admin-header h1 span {
        color: var(--orange);
      }
      .admin-user {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .admin-user .email {
        font-weight: 500;
        color: var(--gray-500);
        font-size: 0.9rem;
      }

      .admin-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 28px;
        flex-wrap: wrap;
        border-bottom: 2px solid var(--gray-200);
        padding-bottom: 4px;
      }
      .admin-tabs .tab-btn {
        padding: 10px 24px;
        border: none;
        background: transparent;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--gray-500);
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: var(--transition);
        font-family: "Inter", sans-serif;
      }
      .admin-tabs .tab-btn:hover {
        color: var(--blue-primary);
      }
      .admin-tabs .tab-btn.active {
        color: var(--blue-primary);
        border-bottom-color: var(--orange);
      }

      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }
      .panel-header h2 {
        font-family: "Playfair Display", serif;
        font-size: 1.4rem;
        color: var(--blue-deep);
      }

      /* =============================================
                   LIST / TABLE
                   ============================================= */
      .list-container {
        background: var(--white);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--gray-200);
        overflow: hidden;
      }
      .list-container .empty-state {
        padding: 48px 24px;
        text-align: center;
        color: var(--gray-500);
      }
      .list-container .empty-state i {
        font-size: 2.5rem;
        color: var(--gray-300);
        margin-bottom: 12px;
      }

      .admin-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      .admin-table th {
        background: var(--gray-100);
        text-align: left;
        padding: 12px 16px;
        font-weight: 600;
        color: var(--gray-700);
        border-bottom: 2px solid var(--gray-200);
      }
      .admin-table td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--gray-100);
        vertical-align: middle;
      }
      .admin-table tr:hover td {
        background: var(--gray-50);
      }
      .admin-table .actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .admin-table .badge {
        display: inline-block;
        padding: 2px 12px;
        border-radius: 30px;
        font-size: 0.7rem;
        font-weight: 600;
        background: var(--blue-light);
        color: var(--blue-primary);
      }
      .admin-table .badge.orange {
        background: var(--orange-glow);
        color: var(--orange);
      }

      /* =============================================
                   FORMS (Modals)
                   ============================================= */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 9998;
        background: rgba(10, 42, 58, 0.6);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal-overlay.active {
        display: flex;
      }
      .modal-box {
        background: var(--white);
        border-radius: var(--radius);
        max-width: 720px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        padding: 32px 36px;
        box-shadow: var(--shadow-lg);
        animation: fadeUp 0.3s ease;
        position: relative;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .modal-box .modal-close {
        position: sticky;
        top: 0;
        float: right;
        background: none;
        border: none;
        font-size: 1.4rem;
        color: var(--gray-500);
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 50%;
        transition: var(--transition);
        z-index: 10;
      }
      .modal-box .modal-close:hover {
        background: var(--gray-100);
      }
      .modal-box h2 {
        font-family: "Playfair Display", serif;
        font-size: 1.6rem;
        color: var(--blue-deep);
        margin-bottom: 20px;
        clear: both;
      }

      .form-group {
        margin-bottom: 16px;
      }
      .form-group label {
        display: block;
        font-weight: 500;
        font-size: 0.85rem;
        margin-bottom: 4px;
        color: var(--gray-700);
      }
      .form-group label .required {
        color: #e74c3c;
      }
      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 10px 14px;
        border: 1.5px solid var(--gray-200);
        border-radius: var(--radius-sm);
        font-family: "Inter", sans-serif;
        font-size: 0.95rem;
        transition: var(--transition);
        background: var(--gray-50);
      }
      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: var(--blue-primary);
        box-shadow: 0 0 0 4px rgba(26, 82, 118, 0.08);
        background: var(--white);
      }
      .form-group textarea {
        resize: vertical;
        min-height: 80px;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 600px) {
        .form-row {
          grid-template-columns: 1fr;
        }
      }

      /* Pricing repeater */
      .pricing-repeater {
        border: 1px solid var(--gray-200);
        border-radius: var(--radius-sm);
        padding: 12px 16px;
        background: var(--gray-50);
      }
      .pricing-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto;
        gap: 10px;
        align-items: end;
        margin-bottom: 10px;
      }
      .pricing-row .form-group {
        margin-bottom: 0;
      }
      .pricing-row .remove-pricing {
        background: #e74c3c;
        color: #fff;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 0.9rem;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2px;
      }
      .pricing-row .remove-pricing:hover {
        background: #c0392b;
      }
      .add-pricing-btn {
        margin-top: 6px;
      }

      /* Image preview */
      .image-preview {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .image-preview img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: var(--radius-sm);
        border: 2px solid var(--gray-200);
      }
      .image-preview .extra-img-wrapper {
        position: relative;
      }
      .image-preview .remove-extra {
        position: absolute;
        top: -6px;
        right: -6px;
        background: #e74c3c;
        color: #fff;
        border: none;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        font-size: 0.6rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* =============================================
                   TOAST
                   ============================================= */
      .toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .toast {
        padding: 14px 24px;
        border-radius: var(--radius-sm);
        color: #fff;
        font-weight: 500;
        font-size: 0.9rem;
        box-shadow: var(--shadow-lg);
        animation: slideIn 0.3s ease;
        max-width: 400px;
      }
      .toast.success {
        background: #27ae60;
      }
      .toast.error {
        background: #e74c3c;
      }
      .toast.info {
        background: var(--blue-primary);
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(40px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* =============================================
                   RESPONSIVE
                   ============================================= */
      @media (max-width: 768px) {
        body {
          padding: 12px;
        }
        .auth-box {
          padding: 32px 20px;
        }
        .modal-box {
          padding: 24px 16px;
        }
        .admin-header h1 {
          font-size: 1.4rem;
        }
        .admin-table {
          font-size: 0.8rem;
        }
        .admin-table th,
        .admin-table td {
          padding: 8px 10px;
        }
        .pricing-row {
          grid-template-columns: 1fr 1fr;
        }
        .pricing-row .remove-pricing {
          grid-column: span 2;
          width: 100%;
          border-radius: var(--radius-sm);
          height: 38px;
        }
      }
      @media (max-width: 500px) {
        .admin-table {
          display: block;
          overflow-x: auto;
        }
        .admin-table thead {
          display: none;
        }
        .admin-table tbody tr {
          display: block;
          border-bottom: 2px solid var(--gray-200);
          padding: 12px 0;
        }
        .admin-table td {
          display: flex;
          justify-content: space-between;
          padding: 6px 10px;
          border: none;
          align-items: center;
        }
        .admin-table td::before {
          content: attr(data-label);
          font-weight: 600;
          color: var(--gray-700);
        }
        .admin-table td.actions {
          justify-content: flex-end;
          gap: 4px;
        }
      }
    </style>
  </head>
  <body>
    <!-- ============================================================
    TOAST CONTAINER
    ============================================================ -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    AUTH SCREEN
    ============================================================ -->
    <div id="authScreen">
      <div class="auth-box">
        <h1>Acheda <span style="color: var(--orange)">Admin</span></h1>
        <p>Sign in with a magic link sent to your email.</p>
        <div class="form-group">
          <label for="adminEmail">Email Address</label>
          <input type="email" id="adminEmail" placeholder="you@example.com" />
        </div>
        <button class="btn btn-primary btn-block" id="sendLinkBtn">
          <i class="fas fa-envelope"></i> Send Magic Link
        </button>
        <div class="auth-status" id="authStatus"></div>
      </div>
    </div>

    <!-- ============================================================
    DASHBOARD SCREEN
    ============================================================ -->
    <div id="dashboardScreen">
      <div class="container">
        <!-- Header -->
        <div class="admin-header">
          <h1>Acheda <span>Zanzibar</span> · Admin</h1>
          <div class="admin-user">
            <span class="email" id="adminEmailDisplay">admin@example.com</span>
            <button class="btn btn-outline btn-sm" id="logoutBtn">
              <i class="fas fa-sign-out-alt"></i> Logout
            </button>
          </div>
        </div>

        <!-- Tabs -->
        <div class="admin-tabs">
          <button class="tab-btn active" data-tab="groupsTab">
            Tour Groups
          </button>
          <button class="tab-btn" data-tab="daysTab">Package Days</button>
        </div>

        <!-- ==========================================================
            TAB: TOUR GROUPS
            ========================================================== -->
        <div class="tab-panel active" id="groupsTab">
          <div class="panel-header">
            <h2>Manage Tour Groups</h2>
            <button class="btn btn-orange" id="addGroupBtn">
              <i class="fas fa-plus"></i> New Group
            </button>
          </div>
          <div class="list-container" id="groupsList">
            <div class="empty-state">
              <i class="fas fa-spinner fa-spin"></i>
              <p>Loading groups...</p>
            </div>
          </div>
        </div>

        <!-- ==========================================================
            TAB: PACKAGE DAYS
            ========================================================== -->
        <div class="tab-panel" id="daysTab">
          <div class="panel-header">
            <h2>Manage Package Days</h2>
            <button class="btn btn-orange" id="addDayBtn">
              <i class="fas fa-plus"></i> New Day
            </button>
          </div>
          <div class="list-container" id="daysList">
            <div class="empty-state">
              <i class="fas fa-spinner fa-spin"></i>
              <p>Loading days...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============================================================
    MODAL (Add / Edit)
    ============================================================ -->
    <div class="modal-overlay" id="formModal">
      <div class="modal-box">
        <button class="modal-close" id="modalClose">
          <i class="fas fa-times"></i>
        </button>
        <h2 id="modalTitle">Add New</h2>
        <form id="adminForm">
          <!-- Hidden field for editing ID -->
          <input type="hidden" id="formDocId" value="" />

          <!-- ====== GROUP FIELDS ====== -->
          <div id="groupFields">
            <div class="form-group">
              <label>Title <span class="required">*</span></label>
              <input
                type="text"
                id="gTitle"
                placeholder="e.g. 6 Days Island Tour"
                required
              />
            </div>
            <div class="form-group">
              <label>Subtitle</label>
              <input
                type="text"
                id="gSubtitle"
                placeholder="A short tagline for this tour"
              />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Category</label>
                <select id="gCategory">
                  <option value="Packages">Packages</option>
                  <option value="Safari">Safari</option>
                </select>
              </div>
              <div class="form-group">
                <label>Display Order <span class="required">*</span></label>
                <input
                  type="number"
                  id="gDisplayOrder"
                  placeholder="1, 2, 3..."
                  required
                  min="1"
                />
              </div>
            </div>
            <div class="form-group">
              <label>Pricing</label>
              <div class="pricing-repeater" id="pricingRepeater">
                <!-- Dynamic rows will be inserted here -->
                <div class="pricing-row" data-index="0">
                  <div class="form-group">
                    <label>Label</label>
                    <input
                      type="text"
                      class="pricing-label"
                      placeholder="e.g. 1 person"
                    />
                  </div>
                  <div class="form-group">
                    <label>Amount</label>
                    <input
                      type="text"
                      class="pricing-amount"
                      placeholder="e.g. $800"
                    />
                  </div>
                  <div class="form-group">
                    <label>Note</label>
                    <input
                      type="text"
                      class="pricing-note"
                      placeholder="e.g. per person"
                    />
                  </div>
                  <button type="button" class="remove-pricing">
                    <i class="fas fa-minus"></i>
                  </button>
                </div>
              </div>
              <button
                type="button"
                class="btn btn-outline btn-sm add-pricing-btn"
                style="margin-top: 8px"
              >
                <i class="fas fa-plus"></i> Add Pricing Row
              </button>
            </div>
          </div>

          <!-- ====== DAY FIELDS ====== -->
          <div id="dayFields" style="display: none">
            <div class="form-group">
              <label>Belongs to Group <span class="required">*</span></label>
              <select id="dGroupId" required>
                <option value="">Select a group...</option>
              </select>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Day Order <span class="required">*</span></label>
                <input
                  type="number"
                  id="dDayOrder"
                  placeholder="1, 2, 3..."
                  required
                  min="1"
                />
              </div>
              <div class="form-group">
                <label>Tag (optional)</label>
                <input
                  type="text"
                  id="dTag"
                  placeholder="e.g. Most Popular, Adventure"
                />
              </div>
            </div>
            <div class="form-group">
              <label>Title <span class="required">*</span></label>
              <input
                type="text"
                id="dTitle"
                placeholder="e.g. Spice Farm + Prison Island"
                required
              />
            </div>
            <div class="form-group">
              <label>Short Description <span class="required">*</span></label>
              <input
                type="text"
                id="dShortDesc"
                placeholder="Brief text shown on the card"
                required
              />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Duration</label>
                <input type="text" id="dDuration" placeholder="e.g. full day" />
              </div>
              <div class="form-group">
                <label>Pickup Time</label>
                <input
                  type="text"
                  id="dPickupTime"
                  placeholder="e.g. 9:00 AM"
                />
              </div>
            </div>
            <div class="form-group">
              <label>Main Image</label>
              <input type="file" id="dImageFile" accept="image/*" />
              <div class="image-preview" id="dImagePreview"></div>
              <small style="color: var(--gray-500)"
                >Upload a new image to replace the current one.</small
              >
            </div>
            <div class="form-group">
              <label>Full Description (HTML allowed)</label>
              <textarea
                id="dFullDesc"
                rows="5"
                placeholder="Detailed description for the modal..."
              ></textarea>
            </div>
            <div class="form-group">
              <label>Extra Images (multiple)</label>
              <input type="file" id="dExtraImages" accept="image/*" multiple />
              <div class="image-preview" id="dExtraPreview"></div>
              <small style="color: var(--gray-500)"
                >Upload new images to replace all existing extras.</small
              >
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-block"
            style="margin-top: 8px"
          >
            <i class="fas fa-save"></i> Save
          </button>
        </form>
      </div>
    </div>

    <!-- ============================================================
    FIREBASE + ADMIN LOGIC
    ============================================================ -->
    <script type="module">
      // ============================================================
      // 1. FIREBASE CONFIG
      // ============================================================
      const firebaseConfig = {
        apiKey: "AIzaSyCNyWFAINM_L2k9-sM3wnuWYjlEDVoXjE0",
        authDomain: "acheda-zanzibar-tours.firebaseapp.com",
        projectId: "acheda-zanzibar-tours",
        storageBucket: "acheda-zanzibar-tours.firebasestorage.app",
        messagingSenderId: "178711140763",
        appId: "1:178711140763:web:108863107e2457f8eca93e",
      };

      // ============================================================
      // 2. IMPORTS
      // ============================================================
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getAuth,
        sendSignInLinkToEmail,
        isSignInWithEmailLink,
        signInWithEmailLink,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import {
        getFirestore,
        collection,
        doc,
        getDocs,
        getDoc,
        addDoc,
        updateDoc,
        deleteDoc,
        query,
        orderBy,
        where,
        serverTimestamp,
        writeBatch,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import {
        getStorage,
        ref,
        uploadBytes,
        getDownloadURL,
        deleteObject,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const storage = getStorage(app);

      // ============================================================
      // 3. DOM REFS
      // ============================================================
      const authScreen = document.getElementById("authScreen");
      const dashboardScreen = document.getElementById("dashboardScreen");
      const adminEmailInput = document.getElementById("adminEmail");
      const sendLinkBtn = document.getElementById("sendLinkBtn");
      const authStatus = document.getElementById("authStatus");
      const adminEmailDisplay = document.getElementById("adminEmailDisplay");
      const logoutBtn = document.getElementById("logoutBtn");

      const groupsList = document.getElementById("groupsList");
      const daysList = document.getElementById("daysList");
      const addGroupBtn = document.getElementById("addGroupBtn");
      const addDayBtn = document.getElementById("addDayBtn");

      const formModal = document.getElementById("formModal");
      const modalClose = document.getElementById("modalClose");
      const modalTitle = document.getElementById("modalTitle");
      const adminForm = document.getElementById("adminForm");
      const formDocId = document.getElementById("formDocId");

      const groupFields = document.getElementById("groupFields");
      const dayFields = document.getElementById("dayFields");

      // Group fields
      const gTitle = document.getElementById("gTitle");
      const gSubtitle = document.getElementById("gSubtitle");
      const gCategory = document.getElementById("gCategory");
      const gDisplayOrder = document.getElementById("gDisplayOrder");
      const pricingRepeater = document.getElementById("pricingRepeater");

      // Day fields
      const dGroupId = document.getElementById("dGroupId");
      const dDayOrder = document.getElementById("dDayOrder");
      const dTag = document.getElementById("dTag");
      const dTitle = document.getElementById("dTitle");
      const dShortDesc = document.getElementById("dShortDesc");
      const dDuration = document.getElementById("dDuration");
      const dPickupTime = document.getElementById("dPickupTime");
      const dImageFile = document.getElementById("dImageFile");
      const dImagePreview = document.getElementById("dImagePreview");
      const dFullDesc = document.getElementById("dFullDesc");
      const dExtraImages = document.getElementById("dExtraImages");
      const dExtraPreview = document.getElementById("dExtraPreview");

      const toastContainer = document.getElementById("toastContainer");

      // Tab buttons
      const tabBtns = document.querySelectorAll(".tab-btn");
      const tabPanels = {
        groups: document.getElementById("groupsTab"),
        days: document.getElementById("daysTab"),
      };

      // ============================================================
      // 4. TOAST SYSTEM
      // ============================================================
      function showToast(message, type = "info") {
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.textContent = message;
        toastContainer.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transform = "translateX(40px)";
          setTimeout(() => toast.remove(), 300);
        }, 3500);
      }

      // ============================================================
      // 5. AUTHENTICATION
      // ============================================================
      const actionCodeSettings = {
        url: window.location.href,
        handleCodeInApp: true,
      };

      sendLinkBtn.addEventListener("click", async () => {
        const email = adminEmailInput.value.trim();
        if (!email) {
          authStatus.className = "auth-status error";
          authStatus.textContent = "Please enter your email address.";
          return;
        }
        authStatus.className = "auth-status";
        authStatus.textContent = "Sending link...";
        try {
          await sendSignInLinkToEmail(auth, email, actionCodeSettings);
          window.localStorage.setItem("emailForSignIn", email);
          authStatus.className = "auth-status success";
          authStatus.textContent = `✅ Magic link sent to ${email}. Check your inbox!`;
          adminEmailInput.value = "";
        } catch (error) {
          console.error(error);
          authStatus.className = "auth-status error";
          authStatus.textContent = "❌ " + error.message;
        }
      });

      // Handle magic link sign-in
      if (isSignInWithEmailLink(auth, window.location.href)) {
        let email = window.localStorage.getItem("emailForSignIn");
        if (!email) {
          email = window.prompt(
            "Please enter your email address to confirm sign-in.",
          );
        }
        if (email) {
          signInWithEmailLink(auth, email, window.location.href)
            .then(() => {
              window.localStorage.removeItem("emailForSignIn");
              window.location.href = window.location.href.split("?")[0];
            })
            .catch((error) => {
              console.error(error);
              alert("Sign-in failed: " + error.message);
            });
        }
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          // Check if admin
          checkIsAdmin(user);
        } else {
          authScreen.style.display = "flex";
          dashboardScreen.classList.remove("active");
          dashboardScreen.style.display = "none";
        }
      });

      async function checkIsAdmin(user) {
        try {
          const adminDoc = await getDoc(doc(db, "admins", user.uid));
          if (adminDoc.exists() && adminDoc.data().isAdmin === true) {
            // Admin confirmed
            authScreen.style.display = "none";
            dashboardScreen.style.display = "block";
            dashboardScreen.classList.add("active");
            adminEmailDisplay.textContent = user.email;
            loadGroups();
            loadDays();
            populateGroupSelect();
          } else {
            showToast("You are not authorized as an admin.", "error");
            await auth.signOut();
          }
        } catch (error) {
          console.error(error);
          showToast("Error checking admin status.", "error");
          await auth.signOut();
        }
      }

      logoutBtn.addEventListener("click", () => {
        auth.signOut();
        window.location.reload();
      });

      // ============================================================
      // 6. TAB SWITCHING
      // ============================================================
      tabBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          tabBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const target = btn.dataset.tab;
          Object.values(tabPanels).forEach((p) => p.classList.remove("active"));
          if (target === "groupsTab") tabPanels.groups.classList.add("active");
          if (target === "daysTab") tabPanels.days.classList.add("active");
        });
      });

      // ============================================================
      // 7. PRICING REPEATER
      // ============================================================
      function getPricingRows() {
        const rows = pricingRepeater.querySelectorAll(".pricing-row");
        const pricing = [];
        rows.forEach((row) => {
          const label = row.querySelector(".pricing-label").value.trim();
          const amount = row.querySelector(".pricing-amount").value.trim();
          const note = row.querySelector(".pricing-note").value.trim();
          if (label || amount) {
            pricing.push({ label, amount, note });
          }
        });
        return pricing;
      }

      function setPricingRows(pricingArray) {
        pricingRepeater.innerHTML = "";
        if (!pricingArray || pricingArray.length === 0) {
          // Add one empty row
          addPricingRow({ label: "", amount: "", note: "" });
          return;
        }
        pricingArray.forEach((p) => addPricingRow(p));
      }

      function addPricingRow(data = { label: "", amount: "", note: "" }) {
        const row = document.createElement("div");
        row.className = "pricing-row";
        const index = pricingRepeater.children.length;
        row.innerHTML = `
                        <div class="form-group">
                            <label>Label</label>
                            <input type="text" class="pricing-label" placeholder="e.g. 1 person" value="${data.label}" />
                        </div>
                        <div class="form-group">
                            <label>Amount</label>
                            <input type="text" class="pricing-amount" placeholder="e.g. $800" value="${data.amount}" />
                        </div>
                        <div class="form-group">
                            <label>Note</label>
                            <input type="text" class="pricing-note" placeholder="e.g. per person" value="${data.note}" />
                        </div>
                        <button type="button" class="remove-pricing"><i class="fas fa-minus"></i></button>
                    `;
        pricingRepeater.appendChild(row);
        row.querySelector(".remove-pricing").addEventListener("click", () => {
          if (pricingRepeater.children.length > 1) {
            row.remove();
          } else {
            showToast("You need at least one pricing row.", "error");
          }
        });
      }

      document
        .querySelector(".add-pricing-btn")
        .addEventListener("click", () => {
          addPricingRow({ label: "", amount: "", note: "" });
        });

      // ============================================================
      // 8. LOAD GROUPS
      // ============================================================
      async function loadGroups() {
        try {
          const q = query(
            collection(db, "tourGroups"),
            orderBy("displayOrder", "asc"),
          );
          const snap = await getDocs(q);
          if (snap.empty) {
            groupsList.innerHTML = `
                                <div class="empty-state">
                                    <i class="fas fa-folder-open"></i>
                                    <p>No tour groups yet. Click "New Group" to get started.</p>
                                </div>
                            `;
            return;
          }
          let html = `
                            <table class="admin-table">
                                <thead>
                                    <tr>
                                        <th>Title</th>
                                        <th>Category</th>
                                        <th>Order</th>
                                        <th>Days</th>
                                        <th style="width:160px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;
          for (const docSnap of snap.docs) {
            const data = docSnap.data();
            const id = docSnap.id;
            // Count days
            const daysQ = query(
              collection(db, "packageDays"),
              where("groupId", "==", id),
            );
            const daysSnap = await getDocs(daysQ);
            const dayCount = daysSnap.size;
            html += `
                                <tr>
                                    <td data-label="Title"><strong>${data.title || "Untitled"}</strong></td>
                                    <td data-label="Category"><span class="badge">${data.category || "Packages"}</span></td>
                                    <td data-label="Order">${data.displayOrder || "-"}</td>
                                    <td data-label="Days">${dayCount}</td>
                                    <td data-label="Actions" class="actions">
                                        <button class="btn btn-primary btn-sm edit-group" data-id="${id}"><i class="fas fa-edit"></i></button>
                                        <button class="btn btn-danger btn-sm delete-group" data-id="${id}"><i class="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                            `;
          }
          html += `</tbody></table>`;
          groupsList.innerHTML = html;

          // Attach events
          groupsList.querySelectorAll(".edit-group").forEach((btn) => {
            btn.addEventListener("click", () => editGroup(btn.dataset.id));
          });
          groupsList.querySelectorAll(".delete-group").forEach((btn) => {
            btn.addEventListener("click", () => deleteGroup(btn.dataset.id));
          });
        } catch (error) {
          console.error(error);
          groupsList.innerHTML = `<div class="empty-state"><p>Error loading groups.</p></div>`;
          showToast("Error loading groups.", "error");
        }
      }

      // ============================================================
      // 9. LOAD DAYS
      // ============================================================
      async function loadDays() {
        try {
          const q = query(
            collection(db, "packageDays"),
            orderBy("dayOrder", "asc"),
          );
          const snap = await getDocs(q);
          if (snap.empty) {
            daysList.innerHTML = `
                                <div class="empty-state">
                                    <i class="fas fa-calendar-day"></i>
                                    <p>No package days yet. Click "New Day" to add one.</p>
                                </div>
                            `;
            return;
          }
          let html = `
                            <table class="admin-table">
                                <thead>
                                    <tr>
                                        <th>Day</th>
                                        <th>Title</th>
                                        <th>Group</th>
                                        <th>Tag</th>
                                        <th style="width:140px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;
          for (const docSnap of snap.docs) {
            const data = docSnap.data();
            const id = docSnap.id;
            // Get group title
            let groupTitle = "Unknown";
            if (data.groupId) {
              try {
                const gDoc = await getDoc(doc(db, "tourGroups", data.groupId));
                if (gDoc.exists()) groupTitle = gDoc.data().title || "Untitled";
              } catch (e) {
                /* ignore */
              }
            }
            html += `
                                <tr>
                                    <td data-label="Day">${data.dayOrder || "-"}</td>
                                    <td data-label="Title"><strong>${data.title || "Untitled"}</strong></td>
                                    <td data-label="Group">${groupTitle}</td>
                                    <td data-label="Tag">${data.tag ? `<span class="badge orange">${data.tag}</span>` : "-"}</td>
                                    <td data-label="Actions" class="actions">
                                        <button class="btn btn-primary btn-sm edit-day" data-id="${id}"><i class="fas fa-edit"></i></button>
                                        <button class="btn btn-danger btn-sm delete-day" data-id="${id}"><i class="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                            `;
          }
          html += `</tbody></table>`;
          daysList.innerHTML = html;

          daysList.querySelectorAll(".edit-day").forEach((btn) => {
            btn.addEventListener("click", () => editDay(btn.dataset.id));
          });
          daysList.querySelectorAll(".delete-day").forEach((btn) => {
            btn.addEventListener("click", () => deleteDay(btn.dataset.id));
          });
        } catch (error) {
          console.error(error);
          daysList.innerHTML = `<div class="empty-state"><p>Error loading days.</p></div>`;
          showToast("Error loading days.", "error");
        }
      }

      // ============================================================
      // 10. POPULATE GROUP SELECT (for day form)
      // ============================================================
      async function populateGroupSelect() {
        try {
          const q = query(
            collection(db, "tourGroups"),
            orderBy("displayOrder", "asc"),
          );
          const snap = await getDocs(q);
          dGroupId.innerHTML = '<option value="">Select a group...</option>';
          snap.forEach((doc) => {
            const data = doc.data();
            const opt = document.createElement("option");
            opt.value = doc.id;
            opt.textContent = data.title || doc.id;
            dGroupId.appendChild(opt);
          });
        } catch (error) {
          console.error(error);
        }
      }

      // ============================================================
      // 11. MODAL HELPERS
      // ============================================================
      function openModal(title, isGroup) {
        modalTitle.textContent = title;
        groupFields.style.display = isGroup ? "block" : "none";
        dayFields.style.display = isGroup ? "none" : "block";
        formDocId.value = "";
        adminForm.reset();
        dImagePreview.innerHTML = "";
        dExtraPreview.innerHTML = "";
        formModal.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        formModal.classList.remove("active");
        document.body.style.overflow = "";
      }

      modalClose.addEventListener("click", closeModal);
      formModal.addEventListener("click", (e) => {
        if (e.target === formModal) closeModal();
      });

      // ============================================================
      // 12. ADD / EDIT GROUP
      // ============================================================
      addGroupBtn.addEventListener("click", () => {
        openModal("New Tour Group", true);
        setPricingRows([{ label: "", amount: "", note: "" }]);
      });

      async function editGroup(id) {
        try {
          const docSnap = await getDoc(doc(db, "tourGroups", id));
          if (!docSnap.exists()) {
            showToast("Group not found.", "error");
            return;
          }
          const data = docSnap.data();
          openModal("Edit Tour Group", true);
          formDocId.value = id;
          gTitle.value = data.title || "";
          gSubtitle.value = data.subtitle || "";
          gCategory.value = data.category || "Packages";
          gDisplayOrder.value = data.displayOrder || "";
          if (data.pricing && Array.isArray(data.pricing)) {
            setPricingRows(data.pricing);
          } else {
            setPricingRows([{ label: "", amount: "", note: "" }]);
          }
        } catch (error) {
          console.error(error);
          showToast("Error loading group.", "error");
        }
      }

      async function deleteGroup(id) {
        if (!confirm("Delete this tour group and ALL its package days?"))
          return;
        try {
          // Delete all days first
          const daysQ = query(
            collection(db, "packageDays"),
            where("groupId", "==", id),
          );
          const daysSnap = await getDocs(daysQ);
          const batch = writeBatch(db);
          daysSnap.forEach((d) => batch.delete(doc(db, "packageDays", d.id)));
          await batch.commit();

          // Delete the group
          await deleteDoc(doc(db, "tourGroups", id));
          showToast("Group and its days deleted.", "success");
          loadGroups();
          loadDays();
          populateGroupSelect();
        } catch (error) {
          console.error(error);
          showToast("Error deleting group.", "error");
        }
      }

      // ============================================================
      // 13. ADD / EDIT DAY
      // ============================================================
      addDayBtn.addEventListener("click", () => {
        openModal("New Package Day", false);
        dGroupId.value = "";
      });

      async function editDay(id) {
        try {
          const docSnap = await getDoc(doc(db, "packageDays", id));
          if (!docSnap.exists()) {
            showToast("Day not found.", "error");
            return;
          }
          const data = docSnap.data();
          openModal("Edit Package Day", false);
          formDocId.value = id;
          dGroupId.value = data.groupId || "";
          dDayOrder.value = data.dayOrder || "";
          dTag.value = data.tag || "";
          dTitle.value = data.title || "";
          dShortDesc.value = data.shortDescription || "";
          dDuration.value = data.duration || "";
          dPickupTime.value = data.pickupTime || "";
          dFullDesc.value = data.fullDescription || "";

          // Show current image
          dImagePreview.innerHTML = "";
          if (data.imageUrl) {
            const img = document.createElement("img");
            img.src = data.imageUrl;
            img.alt = "Current main image";
            dImagePreview.appendChild(img);
          }

          // Show current extra images
          dExtraPreview.innerHTML = "";
          if (data.extraImages && data.extraImages.length > 0) {
            data.extraImages.forEach((url) => {
              const wrapper = document.createElement("div");
              wrapper.className = "extra-img-wrapper";
              const img = document.createElement("img");
              img.src = url;
              img.alt = "Extra image";
              wrapper.appendChild(img);
              dExtraPreview.appendChild(wrapper);
            });
          }
        } catch (error) {
          console.error(error);
          showToast("Error loading day.", "error");
        }
      }

      async function deleteDay(id) {
        if (!confirm("Delete this package day?")) return;
        try {
          // Optional: delete image from storage? We'll just remove the doc.
          await deleteDoc(doc(db, "packageDays", id));
          showToast("Day deleted.", "success");
          loadDays();
        } catch (error) {
          console.error(error);
          showToast("Error deleting day.", "error");
        }
      }

      // ============================================================
      // 14. IMAGE UPLOAD HELPERS
      // ============================================================
      async function uploadImage(file, path) {
        const storageRef = ref(storage, `packages/${path}_${Date.now()}`);
        await uploadBytes(storageRef, file);
        return await getDownloadURL(storageRef);
      }

      // ============================================================
      // 15. FORM SUBMISSION (CREATE / UPDATE)
      // ============================================================
      adminForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const isGroup = groupFields.style.display !== "none";
        const docId = formDocId.value;

        try {
          if (isGroup) {
            // --- GROUP ---
            const title = gTitle.value.trim();
            if (!title) {
              showToast("Title is required.", "error");
              return;
            }
            const displayOrder = parseInt(gDisplayOrder.value);
            if (isNaN(displayOrder)) {
              showToast("Display Order must be a number.", "error");
              return;
            }

            const pricing = getPricingRows();
            const data = {
              title,
              subtitle: gSubtitle.value.trim(),
              category: gCategory.value,
              displayOrder,
              pricing,
              updatedAt: serverTimestamp(),
            };

            if (docId) {
              await updateDoc(doc(db, "tourGroups", docId), data);
              showToast("Group updated!", "success");
            } else {
              data.createdAt = serverTimestamp();
              await addDoc(collection(db, "tourGroups"), data);
              showToast("Group created!", "success");
            }
            closeModal();
            loadGroups();
            populateGroupSelect();
          } else {
            // --- DAY ---
            const groupId = dGroupId.value;
            if (!groupId) {
              showToast("Please select a group.", "error");
              return;
            }
            const dayOrder = parseInt(dDayOrder.value);
            if (isNaN(dayOrder)) {
              showToast("Day Order must be a number.", "error");
              return;
            }
            const title = dTitle.value.trim();
            if (!title) {
              showToast("Title is required.", "error");
              return;
            }
            const shortDesc = dShortDesc.value.trim();
            if (!shortDesc) {
              showToast("Short description is required.", "error");
              return;
            }

            let imageUrl = "";
            let extraImages = [];

            // Upload main image if provided
            if (dImageFile.files.length > 0) {
              const file = dImageFile.files[0];
              imageUrl = await uploadImage(file, `main_${title.slice(0, 20)}`);
            } else if (docId) {
              // Keep existing image
              const existing = await getDoc(doc(db, "packageDays", docId));
              if (existing.exists()) {
                imageUrl = existing.data().imageUrl || "";
              }
            }

            // Upload extra images if provided
            if (dExtraImages.files.length > 0) {
              const files = Array.from(dExtraImages.files);
              const uploads = files.map((file, i) =>
                uploadImage(file, `extra_${title.slice(0, 20)}_${i}`),
              );
              extraImages = await Promise.all(uploads);
            } else if (docId) {
              const existing = await getDoc(doc(db, "packageDays", docId));
              if (existing.exists()) {
                extraImages = existing.data().extraImages || [];
              }
            }

            const data = {
              groupId,
              dayOrder,
              title,
              shortDescription: shortDesc,
              tag: dTag.value.trim(),
              duration: dDuration.value.trim(),
              pickupTime: dPickupTime.value.trim(),
              fullDescription: dFullDesc.value,
              imageUrl,
              extraImages,
              updatedAt: serverTimestamp(),
            };

            if (docId) {
              await updateDoc(doc(db, "packageDays", docId), data);
              showToast("Day updated!", "success");
            } else {
              data.createdAt = serverTimestamp();
              await addDoc(collection(db, "packageDays"), data);
              showToast("Day created!", "success");
            }
            closeModal();
            loadDays();
            loadGroups(); // to refresh day count
          }
        } catch (error) {
          console.error(error);
          showToast("Error saving: " + error.message, "error");
        }
      });

      // ============================================================
      // 16. INIT: show loading state
      // ============================================================
      groupsList.innerHTML =
        '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading groups...</p></div>';
      daysList.innerHTML =
        '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading days...</p></div>';

      console.log("✅ Acheda Admin Panel ready.");
    </script>
  </body>
</html>
