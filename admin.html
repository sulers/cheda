<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Acheda Zanzibar Tours</title>
    <link
      rel="icon"
      type="image/png"
      href="https://ui-avatars.com/api/?name=AZ&background=1a5276&color=fff&size=32"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      :root {
        --blue-deep: #0a2a3a;
        --blue-primary: #1a5276;
        --blue-bright: #2a7a9a;
        --blue-light: #eaf2f7;
        --orange: #e67e22;
        --white: #ffffff;
        --gray-50: #f8fafc;
        --gray-100: #f1f4f8;
        --gray-200: #e2e8f0;
        --gray-300: #cbd5e1;
        --gray-500: #64748b;
        --gray-700: #1e293b;
        --radius: 14px;
        --radius-sm: 8px;
        --shadow: 0 4px 16px rgba(10, 42, 58, 0.08);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--gray-50);
        color: var(--gray-700);
        line-height: 1.5;
      }
      h1,
      h2,
      h3 {
        font-family: "Playfair Display", serif;
        color: var(--blue-deep);
      }
      img {
        max-width: 100%;
        display: block;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }

      /* ---------- LOGIN ---------- */
      #loginScreen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .login-card {
        background: var(--white);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 40px 36px;
        width: 100%;
        max-width: 360px;
      }
      .login-card h1 {
        font-size: 1.5rem;
        margin-bottom: 6px;
      }
      .login-card p {
        color: var(--gray-500);
        font-size: 0.9rem;
        margin-bottom: 24px;
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-size: 0.82rem;
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--gray-700);
      }
      .field input {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--gray-200);
        border-radius: var(--radius-sm);
        font-size: 0.95rem;
      }
      .field input:focus {
        outline: 2px solid var(--blue-bright);
        border-color: transparent;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 30px;
        border: none;
        font-weight: 600;
        font-size: 0.92rem;
        transition: 0.2s ease;
      }
      .btn-primary {
        background: var(--blue-primary);
        color: #fff;
        width: 100%;
      }
      .btn-primary:hover {
        background: var(--blue-deep);
      }
      .btn-orange {
        background: var(--orange);
        color: #fff;
      }
      .btn-orange:hover {
        background: #d35400;
      }
      .btn-outline {
        background: transparent;
        border: 1.5px solid var(--blue-primary);
        color: var(--blue-primary);
        font-size: 0.82rem;
        padding: 8px 16px;
      }
      .btn-outline:hover {
        background: var(--blue-primary);
        color: #fff;
      }
      .error-msg {
        color: #c0392b;
        font-size: 0.85rem;
        margin-top: 10px;
        min-height: 18px;
      }

      /* ---------- DASHBOARD ---------- */
      #dashboard {
        display: none;
      }
      .topbar {
        background: var(--blue-deep);
        color: #fff;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 50;
      }
      .topbar h1 {
        color: #fff;
        font-size: 1.15rem;
      }
      .topbar .user-email {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.65);
        margin-top: 2px;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .save-status {
        font-size: 0.85rem;
        color: #9ae6b4;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 20px 80px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--gray-200);
      }
      .tab-btn {
        background: none;
        border: none;
        padding: 12px 18px;
        font-weight: 600;
        color: var(--gray-500);
        border-bottom: 3px solid transparent;
        font-size: 0.95rem;
      }
      .tab-btn.active {
        color: var(--blue-primary);
        border-color: var(--orange);
      }
      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
      }

      .package-row {
        background: #fff;
        border: 1px solid var(--gray-200);
        border-radius: var(--radius);
        padding: 16px 18px;
        margin-bottom: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: center;
      }
      .package-row .pkg-label {
        font-weight: 600;
        font-size: 0.92rem;
        flex: 1 1 240px;
        min-width: 200px;
      }
      .thumb-slot {
        text-align: center;
      }
      .thumb-slot .thumb-caption {
        font-size: 0.7rem;
        color: var(--gray-500);
        margin-top: 4px;
      }
      .thumb {
        width: 84px;
        height: 64px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid var(--gray-200);
        display: block;
      }
      .extra-thumbs {
        display: flex;
        gap: 6px;
      }
      .extra-thumbs .thumb {
        width: 56px;
        height: 44px;
      }

      /* ---------- PRICES ---------- */
      .price-group {
        background: #fff;
        border: 1px solid var(--gray-200);
        border-radius: var(--radius);
        padding: 20px 22px;
        margin-bottom: 18px;
      }
      .price-group h3 {
        font-size: 1.05rem;
        margin-bottom: 14px;
      }
      .price-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }
      .price-item label {
        display: block;
        font-size: 0.8rem;
        color: var(--gray-500);
        margin-bottom: 6px;
      }
      .price-item .price-input-wrap {
        display: flex;
        align-items: center;
        border: 1px solid var(--gray-200);
        border-radius: var(--radius-sm);
        overflow: hidden;
      }
      .price-item .price-input-wrap span {
        background: var(--gray-100);
        padding: 10px 12px;
        font-weight: 600;
        color: var(--gray-500);
      }
      .price-item input {
        border: none;
        padding: 10px 12px;
        width: 100%;
        font-size: 0.95rem;
      }
      .price-item input:focus {
        outline: none;
      }

      .save-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        border-top: 1px solid var(--gray-200);
        padding: 14px 20px;
        display: flex;
        justify-content: center;
        gap: 14px;
        box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06);
        z-index: 40;
      }

      /* ---------- PICKER MODAL ---------- */
      .modal-overlay-el {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(10, 42, 58, 0.65);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal-overlay-el.active {
        display: flex;
      }
      .picker-box {
        background: #fff;
        border-radius: var(--radius);
        width: 100%;
        max-width: 720px;
        max-height: 85vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .picker-head {
        padding: 18px 22px;
        border-bottom: 1px solid var(--gray-200);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .picker-head h3 {
        font-size: 1.05rem;
      }
      .picker-head button {
        background: none;
        border: none;
        font-size: 1.1rem;
        color: var(--gray-500);
      }
      .picker-grid {
        padding: 18px 22px;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 10px;
      }
      .picker-cell {
        position: relative;
        cursor: pointer;
        border-radius: 8px;
        overflow: hidden;
        border: 3px solid transparent;
        background: var(
          --gray-100
        ); /* placeholder so gaps aren't blank white */
      }
      .picker-cell.selected {
        border-color: var(--orange);
      }
      .picker-cell img {
        width: 100%;
        height: 72px;
        object-fit: cover;
        display: block;
      }
      .picker-cell .num-badge {
        position: absolute;
        top: 3px;
        left: 3px;
        background: rgba(10, 42, 58, 0.75);
        color: #fff;
        font-size: 0.62rem;
        padding: 1px 5px;
        border-radius: 4px;
      }
      .picker-cell .zoom-icon {
        position: absolute;
        bottom: 3px;
        right: 3px;
        background: rgba(10, 42, 58, 0.75);
        color: #fff;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
      }
      .picker-foot {
        padding: 14px 22px;
        border-top: 1px solid var(--gray-200);
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      /* ---------- LIGHTBOX ---------- */
      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 200;
        align-items: center;
        justify-content: center;
        padding: 30px;
      }
      .lightbox.active {
        display: flex;
      }
      .lightbox img {
        max-width: 100%;
        max-height: 90vh;
        border-radius: 8px;
      }
      .lightbox-close {
        position: absolute;
        top: 20px;
        right: 28px;
        color: #fff;
        font-size: 1.6rem;
        background: none;
        border: none;
      }

      .toast {
        position: fixed;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--blue-deep);
        color: #fff;
        padding: 12px 22px;
        border-radius: 30px;
        font-size: 0.9rem;
        z-index: 300;
        display: none;
        box-shadow: var(--shadow);
      }
      .toast.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- ===== LOGIN ===== -->
    <div id="loginScreen">
      <div class="login-card">
        <h1>Admin Sign In</h1>
        <p>Acheda Zanzibar Tours - manage package images &amp; prices</p>
        <form id="loginForm">
          <div class="field">
            <label for="loginEmail">Email</label>
            <input
              type="email"
              id="loginEmail"
              required
              autocomplete="username"
            />
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input
              type="password"
              id="loginPassword"
              required
              autocomplete="current-password"
            />
          </div>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-lock"></i> Sign In
          </button>
          <div class="error-msg" id="loginError"></div>
        </form>
      </div>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div id="dashboard">
      <div class="topbar">
        <div>
          <h1>Acheda Zanzibar Tours - Admin</h1>
          <div class="user-email" id="userEmail"></div>
        </div>
        <div class="topbar-actions">
          <span class="save-status" id="saveStatus"></span>
          <button
            class="btn btn-outline"
            id="signOutBtn"
            style="border-color: rgba(255, 255, 255, 0.4); color: #fff"
          >
            <i class="fas fa-sign-out-alt"></i> Sign Out
          </button>
        </div>
      </div>

      <div class="container">
        <div class="tabs">
          <button class="tab-btn active" data-tab="images">
            <i class="fas fa-images"></i> Package Images
          </button>
          <button class="tab-btn" data-tab="prices">
            <i class="fas fa-tag"></i> Prices
          </button>
        </div>

        <!-- IMAGES TAB -->
        <div class="tab-panel active" id="tab-images">
          <p style="color: var(--gray-500); margin-bottom: 18px">
            Click a package's photo to change it, or "Add/Edit" under extra
            photos to choose what shows in its info popup.
          </p>
          <div id="packageRows"></div>
        </div>

        <!-- PRICES TAB -->
        <div class="tab-panel" id="tab-prices">
          <div id="priceGroups"></div>
        </div>
      </div>

      <div class="save-bar">
        <button class="btn btn-orange" id="saveAllBtn">
          <i class="fas fa-save"></i> Save Changes
        </button>
      </div>
    </div>

    <!-- ===== IMAGE PICKER MODAL ===== -->
    <div class="modal-overlay-el" id="pickerOverlay">
      <div class="picker-box">
        <div class="picker-head">
          <h3 id="pickerTitle">Choose an image</h3>
          <button id="pickerCloseBtn"><i class="fas fa-times"></i></button>
        </div>
        <div class="picker-grid" id="pickerGrid"></div>
        <div class="picker-foot">
          <button class="btn btn-outline" id="pickerCancelBtn">Cancel</button>
          <button class="btn btn-orange" id="pickerConfirmBtn">
            Use Selected
          </button>
        </div>
      </div>
    </div>

    <!-- ===== LIGHTBOX (view bigger) ===== -->
    <div class="lightbox" id="lightbox">
      <button class="lightbox-close" id="lightboxClose">
        <i class="fas fa-times"></i>
      </button>
      <img id="lightboxImg" src="" alt="Preview" />
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
      import {
        auth,
        TOTAL_IMAGES,
        DEFAULT_IMAGES,
        EXTRA_IMAGE_KEYS,
        PACKAGE_LABELS,
        PRICE_LABELS,
        loadMergedConfig,
        saveConfig,
      } from "./site-config.js";
      import {
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

      let workingConfig = null; // { images, extraImages, prices }

      // ---------------- AUTH ----------------
      const loginScreen = document.getElementById("loginScreen");
      const dashboard = document.getElementById("dashboard");
      const loginForm = document.getElementById("loginForm");
      const loginError = document.getElementById("loginError");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        loginError.textContent = "";
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;
        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
          loginError.textContent =
            "Sign in failed - check your email and password.";
        }
      });

      document
        .getElementById("signOutBtn")
        .addEventListener("click", () => signOut(auth));

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          loginScreen.style.display = "none";
          dashboard.style.display = "block";
          document.getElementById("userEmail").textContent = user.email;
          workingConfig = await loadMergedConfig();
          renderPackageRows();
          renderPriceGroups();
        } else {
          loginScreen.style.display = "flex";
          dashboard.style.display = "none";
        }
      });

      // ---------------- TABS ----------------
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".tab-btn")
            .forEach((b) => b.classList.remove("active"));
          document
            .querySelectorAll(".tab-panel")
            .forEach((p) => p.classList.remove("active"));
          btn.classList.add("active");
          document
            .getElementById("tab-" + btn.dataset.tab)
            .classList.add("active");
        });
      });

      // ---------------- RENDER: PACKAGE IMAGE ROWS ----------------
      function renderPackageRows() {
        const container = document.getElementById("packageRows");
        container.innerHTML = "";

        Object.keys(DEFAULT_IMAGES).forEach((key) => {
          const row = document.createElement("div");
          row.className = "package-row";

          const cardNum = workingConfig.images[key];
          const hasExtras = EXTRA_IMAGE_KEYS.includes(key);
          const extraNums = hasExtras
            ? workingConfig.extraImages[key] || []
            : [];

          row.innerHTML = `
            <div class="pkg-label">${PACKAGE_LABELS[key] || key}</div>
            <div class="thumb-slot">
                <img class="thumb" id="cardThumb-${key}" src="./images/${cardNum}.jpeg" alt="Card image" />
                <div class="thumb-caption">Card photo</div>
                <button class="btn btn-outline" style="margin-top:6px;" data-action="pick-card" data-key="${key}">Change</button>
            </div>
            ${
              hasExtras
                ? `
            <div class="thumb-slot">
                <div class="extra-thumbs" id="extraThumbs-${key}">
                    ${extraNums.map((n) => `<img class="thumb" src="./images/${n}.jpeg" alt="Extra image" />`).join("")}
                </div>
                <div class="thumb-caption">Extra photos (popup)</div>
                <button class="btn btn-outline" style="margin-top:6px;" data-action="pick-extra" data-key="${key}">Edit</button>
            </div>`
                : ""
            }
        `;
          container.appendChild(row);
        });

        container
          .querySelectorAll('[data-action="pick-card"]')
          .forEach((btn) => {
            btn.addEventListener("click", () =>
              openPicker({
                mode: "single",
                key: btn.dataset.key,
                kind: "card",
              }),
            );
          });
        container
          .querySelectorAll('[data-action="pick-extra"]')
          .forEach((btn) => {
            btn.addEventListener("click", () =>
              openPicker({
                mode: "multi",
                key: btn.dataset.key,
                kind: "extra",
              }),
            );
          });
      }

      // ---------------- RENDER: PRICE GROUPS ----------------
      const PRICE_GROUPS = [
        {
          title: "6 Days Package",
          keys: ["6days-1", "6days-2", "6days-2-5", "6days-5-10"],
        },
        { title: "5 Days Package", keys: ["5days-1", "5days-2", "5days-3-6"] },
        {
          title: "4 Days Package",
          keys: ["4days-1", "4days-2", "4days-2-5", "4days-5-10"],
        },
        { title: "3 Days Package", keys: ["3days-1", "3days-2", "3days-3-6"] },
        {
          title: "Airport Transfers",
          keys: [
            "transport-kendwa",
            "transport-matemwe",
            "transport-pongwe",
            "transport-paje",
            "transport-dongwe",
            "transport-kizimkazi",
            "transport-fumba",
            "transport-stonetown",
            "transport-fullday",
          ],
        },
      ];

      function renderPriceGroups() {
        const container = document.getElementById("priceGroups");
        container.innerHTML = "";

        PRICE_GROUPS.forEach((group) => {
          const box = document.createElement("div");
          box.className = "price-group";
          box.innerHTML = `
            <h3>${group.title}</h3>
            <div class="price-grid">
                ${group.keys
                  .map(
                    (k) => `
                    <div class="price-item">
                        <label>${PRICE_LABELS[k]}</label>
                        <div class="price-input-wrap">
                            <span>$</span>
                            <input type="number" min="0" step="1" data-price="${k}" value="${workingConfig.prices[k]}" />
                        </div>
                    </div>
                `,
                  )
                  .join("")}
            </div>
        `;
          container.appendChild(box);
        });

        container.querySelectorAll("input[data-price]").forEach((input) => {
          input.addEventListener("input", () => {
            const key = input.dataset.price;
            const val = parseInt(input.value, 10);
            workingConfig.prices[key] = isNaN(val) ? 0 : val;
          });
        });
      }

      // ---------------- IMAGE PICKER ----------------
      const pickerOverlay = document.getElementById("pickerOverlay");
      const pickerGrid = document.getElementById("pickerGrid");
      const pickerTitle = document.getElementById("pickerTitle");
      const pickerConfirmBtn = document.getElementById("pickerConfirmBtn");
      let pickerState = null; // { mode, key, kind, selected: Set }

      function openPicker({ mode, key, kind }) {
        const currentCard = workingConfig.images[key];
        const currentExtras = workingConfig.extraImages
          ? workingConfig.extraImages[key] || []
          : [];
        const selected = new Set(
          mode === "single" ? [currentCard] : currentExtras,
        );

        pickerState = { mode, key, kind, selected };
        pickerTitle.textContent =
          mode === "single"
            ? "Choose the card photo"
            : "Choose extra photos (select as many as you like)";

        pickerGrid.innerHTML = "";
        for (let n = 1; n <= TOTAL_IMAGES; n++) {
          const cell = document.createElement("div");
          cell.className = "picker-cell" + (selected.has(n) ? " selected" : "");
          cell.dataset.num = n;
          cell.innerHTML = `
            <img src="./images/${n}.jpeg" alt="Image ${n}" width="90" height="72" decoding="async" />
            <span class="num-badge">${n}</span>
            <span class="zoom-icon" data-zoom="${n}"><i class="fas fa-expand"></i></span>
          `;
          cell.addEventListener("click", (e) => {
            if (e.target.closest("[data-zoom]")) {
              openLightbox(`./images/${n}.jpeg`);
              return;
            }
            if (pickerState.mode === "single") {
              pickerGrid
                .querySelectorAll(".picker-cell")
                .forEach((c) => c.classList.remove("selected"));
              cell.classList.add("selected");
              pickerState.selected = new Set([n]);
            } else {
              if (pickerState.selected.has(n)) {
                pickerState.selected.delete(n);
                cell.classList.remove("selected");
              } else {
                pickerState.selected.add(n);
                cell.classList.add("selected");
              }
            }
          });
          pickerGrid.appendChild(cell);
        }

        pickerOverlay.classList.add("active");
      }

      pickerConfirmBtn.addEventListener("click", () => {
        if (!pickerState) return;
        const { mode, key, selected } = pickerState;
        if (mode === "single") {
          const n = [...selected][0];
          if (n) {
            workingConfig.images[key] = n;
            document.getElementById(`cardThumb-${key}`).src =
              `./images/${n}.jpeg`;
          }
        } else {
          const nums = [...selected];
          workingConfig.extraImages[key] = nums;
          document.getElementById(`extraThumbs-${key}`).innerHTML = nums
            .map(
              (n) =>
                `<img class="thumb" src="./images/${n}.jpeg" alt="Extra image" />`,
            )
            .join("");
        }
        closePicker();
      });

      document
        .getElementById("pickerCloseBtn")
        .addEventListener("click", closePicker);
      document
        .getElementById("pickerCancelBtn")
        .addEventListener("click", closePicker);
      function closePicker() {
        pickerOverlay.classList.remove("active");
        pickerState = null;
      }

      // ---------------- LIGHTBOX ----------------
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightboxImg");
      function openLightbox(src) {
        lightboxImg.src = src;
        lightbox.classList.add("active");
      }
      document
        .getElementById("lightboxClose")
        .addEventListener("click", () => lightbox.classList.remove("active"));
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) lightbox.classList.remove("active");
      });

      // ---------------- SAVE ----------------
      const toast = document.getElementById("toast");
      document
        .getElementById("saveAllBtn")
        .addEventListener("click", async () => {
          const statusEl = document.getElementById("saveStatus");
          statusEl.textContent = "Saving...";
          try {
            await saveConfig(workingConfig);
            statusEl.textContent = "Saved";
            showToast("Changes saved - the live site will reflect this now.");
            setTimeout(() => (statusEl.textContent = ""), 3000);
          } catch (err) {
            statusEl.textContent = "";
            showToast(
              "Could not save - check your connection and permissions.",
            );
            console.error(err);
          }
        });

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3500);
      }
    </script>
  </body>
</html>
